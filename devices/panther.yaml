notes: >-
  Owner's hardware; two units. Reference phone for the project. Known
  constraints: 8 GB RAM shared with Android, so a 3 GB model plus KV cache is at
  the edge; USB-C hub must provide PD passthrough and gigabit Ethernet; no case,
  airflow required for sustained load. One unit inspected 2026-10-17: stock
  Android 17 (SDK 37), user/release-keys, unrooted, 7.65 GB visible RAM, battery
  at 80% and 24.2 C (idle reading, not a serving temperature). Exec probe ran on
  this unit (see docs/app-spike.md).

  The block above is the app's own numbers after the dot-product build, from
  docs/performance.md ("Current numbers (0.1.7)"): Qwen3.5-2B Q4_K_M, 32K
  context, `-np 1 -fa on`, mmap, two threads pinned to cores 6-7, screen on, USB
  power, non-streaming 128-token greedy runs through the app's
  /v1/chat/completions. Decode was recorded as two runs, 13.19 and 12.50 tok/s;
  the median is carried here. Prefill is the short-prompt figure, 53 tok/s.

  On the same build and configuration, a 2,415-token prompt decoded at 10.52
  tok/s with prefill at 69 tok/s (35 s instead of 157 s) — the agent-shaped
  case, and the reason prefill, not decode, is the number that limits an agent
  turn. It is recorded here as prose rather than in the fields above because the
  fields are single-valued and mixing rows would make one sentence out of two
  different measurements.

  Deliberately null:

  * after_5min_tps and after_15min_tps — the sustained runs in
    docs/sustained-load.md (burst 8.37, sustained 6.31 tok/s) predate the
    dot-product build and were measured with GGML_CPU_REPACK=ON, which this
    project has since established never repacked: the build had no -march, so
    the dot-product kernels the repack selector requires were absent. Those
    numbers are real measurements of a build this release does not ship, so no
    sustained figure is claimed for the current build.
  * agent_turn_s and watts — not run. Filling them needs one command and one
    piece of hardware: `tools/bench/bench.sh` driving an agent-shaped turn
    through the app, and a USB power meter between the charger and the phone
    while a generation is in flight.
  * runtime_build — the 0.1.7 rows in docs/performance.md do not name the
    llama.cpp revision they were built against.

  Provenance note: docs/performance.md describes its row-by-row model and
  server line as "app 0.4.0 (debug)", while the section carrying these numbers
  is titled "Current numbers (0.1.7)". One of those two is wrong and the
  contradiction is in the document, not here. The section title is used above
  because it is the one attached to the numbers themselves. It should be
  settled in docs/performance.md before any generator quotes an app version
  from that file.
