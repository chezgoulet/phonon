notes: >-
  Owner's hardware; two units. Reference phone for the project. 8 GB RAM shared
  with Android; USB-C hub needs PD passthrough; no case, airflow for sustained
  load. Stock Android 17 (SDK 37), user/release-keys, unrooted.

  Measured 2026-10-19 on app 0.1.14 (versionCode 15), the build with runtime CPU
  kernel variants and the sweep-chosen profile: Qwen3.5-2B Q4_K_M, 32K context,
  two decode threads unpinned, prefill `-tb 4`, `-np 1 -fa on`, mmap, screen on,
  USB power, through the app's own /v1.

  Method: the project's sustained harness. Burst is one 128-token greedy
  generation. Sustained is 38 back-to-back 192-token generations over 874 s.
  Recovery is five idle minutes then one 128-token generation. The agent turn is
  a single 2,251-token prompt (a system prompt and tool schemas of roughly the
  documented 2.8K) plus 128 generated tokens, wall-clock.

  Burst 14.01, sustained median 10.54 (floor 8.94, ceiling 13.69), recovery
  14.33. Battery temperature rose from 23.3 to 33.2 C across the run.

  The harness flags "throttle" at 398 s because decode fell below 0.8 x its
  sustained-head baseline (10.52 against 10.6). That is its threshold rule, not
  evidence of heat: the battery was at 33 C and the processor never approached a
  thermal limit. It is the steady state after the first ten minutes, and the
  sustained median already includes it.

  Deliberately null:

  * watts — needs a USB power meter between the charger and the phone while a
    generation is in flight. Not run; no meter.
  * runtime_build — the llama.cpp revision is pinned in .gitmodules and the
    build script, not in this manifest.
