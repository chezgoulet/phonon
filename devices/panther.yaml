notes: >-
  Owner's hardware; two units. No measurements taken yet. Known constraints:
  8 GB RAM shared with Android, so a 3 GB model plus KV cache is at the edge;
  USB-C hub must provide PD passthrough and gigabit Ethernet; no case, airflow
  required for sustained load. One unit inspected 2026-10-17: stock Android 17
  (SDK 37), user/release-keys, unrooted, 7.65 GB visible RAM, battery at 80%
  and 24.2 C. Exec probe ran on this unit (see docs/app-spike.md).

  App measured 2026-10-17 (docs/app.md): 10.04 tok/s decode / 17.86 prefill with
  the model resident; 5.3 under memory contention. After ~5 min idle the kernel
  evicted the model pages and an 8-token request took 41 s of wall time; mlock
  is refused (RLIMIT_MEMLOCK). 2.84 GB of weights on this 7.65 GB device is
  unstable under Android reclaim. Sustained numbers are not claimed.
