# Draft F-Droid metadata for Phonon.
#
# The submission target is a merge request against the fdroiddata repository;
# this file lives here so it is versioned with the app it describes. Field
# names follow the Build Metadata Reference. The two values that must be
# confirmed against the buildserver before submitting are marked CONFIRM.

Categories:
  - Internet
  - Development

License: Apache-2.0

AuthorName: Phonon
WebSite: https://phononai.org
SourceCode: https://github.com/chezgoulet/phonon
IssueTracker: https://github.com/chezgoulet/phonon/issues
Changelog: https://github.com/chezgoulet/phonon/blob/HEAD/fastlane/metadata/android/en-US/changelogs/%c.txt

AutoName: Phonon

RepoType: git
Repo: https://github.com/chezgoulet/phonon.git

Builds:
  - versionName: 0.1.17
    versionCode: 18
    commit: v0.1.17
    submodules: true
    # The engine is compiled from the pinned submodule during the build. It is
    # not a prebuilt library and nothing in jniLibs is committed.
    prebuild:
      - ./app/build-native.sh
    # The Gradle wrapper lives in app/, not at the repository root.
    build:
      - ./app/gradlew -p app assembleRelease
    output: app/app/build/outputs/apk/release/app-release-unsigned.apk
    # CONFIRM: the buildserver must offer this NDK. It is r30-rc1; every
    # measured number was produced with it. If sdkmanager cannot fetch an rc,
    # switch to stable 30.0.16248370 in ndkVersion, ANDROID_NDK_VERSION and
    # here together, and re-run the benchmarks before publishing figures.
    ndk: 30.0.16138531

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.17
CurrentVersionCode: 18

# Reproducible builds are verified (docs/REPRODUCIBLE.md), so F-Droid can
# publish the APK we sign instead of re-signing it. That keeps one signature
# across GitHub Releases, Obtainium and F-Droid.
Binaries: https://github.com/chezgoulet/phonon/releases/download/v%v/phonon-%v-%c-arm64-v8a.apk
AllowedAPKSigningKeys: 3ba90e38603769e78fc6fbad6cdf3b3a104527491ec4d5dff52b9ea14ce42837

# If the buildserver cannot reproduce this APK, delete the two lines above and
# F-Droid will build and sign it with its own key instead — still publishable,
# but the F-Droid build then carries a different signature from the GitHub one.
