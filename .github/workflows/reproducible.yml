# Proves the release APK is bit-for-bit reproducible.
#
# Two trees are built from the same commit at two different absolute paths.
# Reproducibility means identical bytes, not "similar size": the point is that
# anyone — F-Droid's buildserver, a packager, a sceptical user — can rebuild the
# APK we ship and get the same file.

name: reproducible

on:
  push:
    branches: [main, testing]
    paths:
      - 'app/**'
      - 'third_party/llama.cpp'
      - '.github/workflows/reproducible.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'third_party/llama.cpp'
      - '.github/workflows/reproducible.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '30.0.16138531'

jobs:
  twice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use the runner's Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::no Android SDK on the runner"; exit 1; }
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
          } >> "$GITHUB_ENV"
          echo "sdk at $SDK"

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | sort | tail -n1)"
          test -n "$SDKM" || { echo "::error::no sdkmanager"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --channel=3 "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "$SDK/ndk/${ANDROID_NDK_VERSION}"

      - name: Build the same commit at two different paths
        run: |
          set -euo pipefail
          mkdir -p /tmp/repro
          for n in one two; do
            dest="/tmp/repro/$n"
            rm -rf "$dest"
            # Copy the worktree including the checked-out submodule and .git,
            # so the two builds differ only in where they live.
            git clone --quiet --no-hardlinks . "$dest"
            rsync -a --exclude '.gradle/' --exclude 'app/app/build/' \
              --exclude '.native-build/' ./ "$dest"/
            ( cd "$dest" && git submodule update --init --recursive --quiet )

            echo "::group::build $n at $dest"
            ( cd "$dest" && PHONON_NATIVE_BUILD="$dest/.native" ./app/build-native.sh )
            ( cd "$dest" && ./app/gradlew -p app --no-daemon -q assembleRelease )
            apk="$(find "$dest/app/app/build/outputs/apk/release" -name '*.apk' | head -n1)"
            test -n "$apk" || { echo "::error::no APK in $dest"; exit 1; }
            sha256sum "$apk" | awk '{print $1}' > "/tmp/repro/$n.sha"
            echo "build $n: $(cat /tmp/repro/$n.sha) $(stat -c%s "$apk") bytes"
            echo "::endgroup::"
          done

      - name: Compare
        run: |
          set -euo pipefail
          a="$(cat /tmp/repro/one.sha)"
          b="$(cat /tmp/repro/two.sha)"
          echo "build one: $a"
          echo "build two: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::NOT REPRODUCIBLE — the two builds differ"
            exit 1
          fi
          echo "REPRODUCIBLE: identical sha256"
          {
            echo "### Reproducible build verified"
            echo
            echo '```'
            echo "sha256: $a"
            echo "commit: $GITHUB_SHA"
            echo "ndk: $ANDROID_NDK_VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
