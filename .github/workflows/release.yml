# Draft GitHub Actions release workflow for Phonon.
# Target path in the repo: .github/workflows/release.yml
#
# On a pushed tag it: checks out (with submodules), enforces a monotonically
# increasing versionCode, builds the release APK with a pinned NDK, signs it with
# the project keystore, and attaches the APK to a GitHub Release.
#
# ASSUMPTIONS / GAPS this workflow depends on (see GAPS.md):
#   * the Gradle wrapper lives in app/ (app/gradlew, with its jar committed)
#   * GraphQL-free: uses the default GITHUB_TOKEN
#   * the secrets below exist: PHONON_KEYSTORE_BASE64,
#     PHONON_KEYSTORE_PASSWORD, PHONON_KEY_ALIAS, PHONON_KEY_PASSWORD
#   * llama.cpp is a pinned submodule (third_party/llama.cpp) built by app/build-native.sh

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pin the NDK. 30.0.16138531 is r30-rc1; prefer the stable r30 30.0.16248370
  # unless the app requires the rc. Keep this in lockstep with
  # app/app/build.gradle.kts (ndkVersion) and fdroiddata/…/com.phononai.app.yml (ndk:).
  ANDROID_NDK_VERSION: '30.0.16138531'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use the runner's Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::no Android SDK on the runner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk at $SDK"

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | sort | tail -n1)"
          test -n "$SDKM" || { echo "::error::no sdkmanager"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          # The pinned NDK is an r30 release candidate, which lives on a preview channel.
          "$SDKM" --channel=3 "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$SDK/ndk/${ANDROID_NDK_VERSION}" >/dev/null

      - name: Build llama.cpp from the pinned submodule
        run: |
          set -euo pipefail
          test -f third_party/llama.cpp/CMakeLists.txt || {
            echo "::error::llama.cpp submodule is missing"; exit 1; }
          ./app/build-native.sh
          ls -l app/app/src/main/jniLibs/arm64-v8a/ | head

      - name: Derive version
        id: ver
        run: |
          set -euo pipefail
          VNAME="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/app/build.gradle.kts | head -n1)"
          VCODE="$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/app/build.gradle.kts | head -n1)"
          test -n "$VNAME" -a -n "$VCODE" || { echo "could not read version"; exit 1; }
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "versionName=$VNAME versionCode=$VCODE tag=${GITHUB_REF_NAME}"

      - name: Tag must match versionName
        run: |
          set -euo pipefail
          test "v${{ steps.ver.outputs.name }}" = "${{ github.ref_name }}" || {
            echo "::error::tag ${{ github.ref_name }} does not match versionName ${{ steps.ver.outputs.name }}"
            exit 1; }

      # Monotonicity guard: the new versionCode must exceed the highest
      # versionCode ever released. We read it from existing v* tags' Gradle files.
      - name: Enforce monotonic versionCode
        run: |
          set -euo pipefail
          NEW="${{ steps.ver.outputs.code }}"
          HIGH=0
          # The tag being built is in this list too; comparing against itself
          # can only ever fail. Previous releases are everything else.
          PREV="$(git tag -l 'v*' | grep -vx "${GITHUB_REF_NAME}" || true)"
          for t in $PREV; do
            c="$(git show "$t:app/app/build.gradle.kts" 2>/dev/null | sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n1)"
            [ -n "$c" ] && [ "$c" -gt "$HIGH" ] && HIGH="$c" || true
          done
          echo "highest previous versionCode = $HIGH, new = $NEW"
          if [ "$NEW" -le "$HIGH" ]; then
            echo "::error::versionCode $NEW is not greater than the previous maximum $HIGH"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONON_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          PHONON_KEYSTORE: ${{ runner.temp }}/release.keystore
          PHONON_KEYSTORE_PASSWORD: ${{ secrets.PHONON_KEYSTORE_PASSWORD }}
          PHONON_KEY_ALIAS: ${{ secrets.PHONON_KEY_ALIAS }}
          PHONON_KEY_PASSWORD: ${{ secrets.PHONON_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The build.gradle.kts release signing block reads these env vars so
          # CI signs without committing secrets. See GAPS.md item "signing config".
          ./app/gradlew -p app --no-daemon :app:assembleRelease

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          APK=$(find app/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK" || { echo "::error::no release APK produced"; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" >/dev/null \
            || { echo "::error::release APK is not signed"; exit 1; }

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)"
          test -n "$APK" || { echo "::error::no signed APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk=$APK"

      - name: Rename artifact
        id: named
        run: |
          set -euo pipefail
          OUT="phonon-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-arm64-v8a.apk"
          cp "${{ steps.apk.outputs.path }}" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Write release notes from changelog
        run: |
          set -euo pipefail
          CL="fastlane/metadata/android/en-US/changelogs/${{ steps.ver.outputs.code }}.txt"
          if [ -f "$CL" ]; then cp "$CL" "$RUNNER_TEMP/notes.txt"; else
            echo "Release ${{ steps.ver.outputs.name }}" > "$RUNNER_TEMP/notes.txt"; fi

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Phonon ${{ steps.ver.outputs.name }}
          body_path: ${{ runner.temp }}/notes.txt
          files: ${{ steps.named.outputs.out }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
